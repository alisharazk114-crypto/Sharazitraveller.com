<!DOCTYPE html>
<html lang="en">
<head>

<title>Sharazi Traveller - Gilgit Baltistan Tours</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f5f7f6;color:#111}
header{background:#0a3d2e;color:white;padding:20px;text-align:center;position:sticky;top:0;z-index:10}
header h1{font-size:26px}
header p{opacity:.9;margin-top:5px}
.hero{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url(https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800);background-size:cover;color:white;padding:60px 20px;text-align:center}
.hero h2{font-size:32px}
.btn{display:inline-block;background:#25D366;color:white;padding:14px 28px;border-radius:30px;text-decoration:none;font-weight:bold;margin-top:15px}
.cards{padding:20px;display:grid;gap:20px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:16px}
.card-body h3{font-size:20px}
.price{color:#0a3d2e;font-weight:bold;font-size:18px;margin:8px 0}
.book{background:#25D366;color:white;padding:10px 20px;border-radius:20px;text-decoration:none;display:inline-block;font-weight:bold}
.booking{background:white;margin:20px;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.booking h2{margin-bottom:15px}
.booking input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px;background:white;-webkit-appearance:none}
.booking button{width:100%;background:#0a3d2e;color:white;padding:16px;border:none;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}
.contact{background:#0a3d2e;color:white;padding:30px 20px;text-align:center;margin-top:20px}
.contact a{color:#25D366;text-decoration:none;font-weight:bold;font-size:18px}
.wa{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:14px 22px;border-radius:30px;text-decoration:none;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:99}
</style>
</head>
